<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Art — Brandon Stewart</title>
  <meta name="description" content="Selected drawings, paintings, and mixed-media work by Brandon Stewart.">
  <link rel="canonical" href="https://bcadestewart.github.io/art.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bcadestewart.github.io/art.html">
  <meta property="og:title" content="Art — Brandon Stewart">
  <meta property="og:description" content="Selected studio work by Brandon Stewart.">
  <meta property="og:image" content="https://bcadestewart.github.io/img/art/ram-skull.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preload" href="fonts/MonaSans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <script>try { if (localStorage.getItem('portfolio-theme') === 'mono') document.documentElement.dataset.theme = 'mono'; } catch (_) {}</script>
  <style>
    @font-face {
      font-family: "Mona Sans";
      src: url("fonts/MonaSans-latin-var.woff2") format("woff2-variations"), url("fonts/MonaSans-latin-var.woff2") format("woff2");
      font-weight: 200 900;
      font-stretch: 75% 125%;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #121214;
      --line: rgba(255, 255, 255, .11);
      --text: #ebebef;
      --text-2: #a1a1a8;
      --text-3: #797981;
      --accent: #a9c5ff;
      --spectrum: linear-gradient(90deg, #637dff, #9869eb 55%, #ed7d83);
      --gutter: clamp(20px, 5vw, 64px);
      --max: 1320px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    :root[data-theme="mono"] {
      --accent: #d6d8de;
      --spectrum: linear-gradient(90deg, #8d9099, #c9ccd3 55%, #eceef2);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-width: 320px; background: var(--bg); color: var(--text);
      font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.0625rem; line-height: 1.6; font-weight: 400;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    body.has-dialog { overflow: hidden; }
    ::selection { background: rgba(169, 197, 255, .32); color: #fff; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    button { font: inherit; }
    h1, h2, p { text-wrap: balance; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: fixed; z-index: 60; top: 12px; left: 12px; padding: 10px 16px;
      border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; text-decoration: none;
      transform: translateY(-200%); transition: transform .2s var(--ease);
    }
    .skip-link:focus { transform: none; }
    .shell { width: min(var(--max), calc(100% - 2 * var(--gutter))); margin-inline: auto; }

    .glass {
      background: rgba(30, 30, 34, .5); border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 10px 30px rgba(0, 0, 0, .35);
      -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
    }
    .site-header {
      position: fixed; inset: 0 0 auto; z-index: 30;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) max(var(--gutter), calc((100% - var(--max)) / 2)) 14px;
      pointer-events: none;
    }
    .site-header::before {
      content: ""; position: absolute; inset: 0 0 -28px; z-index: -1; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0, 0, 0, .92), rgba(0, 0, 0, .6) 55%, rgba(0, 0, 0, 0));
    }
    .site-header > * { pointer-events: auto; }
    .wordmark {
      justify-self: start; display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px;
      border-radius: 999px; text-decoration: none; font-size: .9375rem; font-weight: 560; letter-spacing: -.01em;
    }
    .nav { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
    .nav a {
      display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px;
      color: var(--text-2); text-decoration: none; font-size: .875rem; font-weight: 520;
      transition: color .2s ease, background-color .25s ease;
    }
    .nav a:hover { color: var(--text); }
    .nav a[aria-current="page"] { color: var(--text); background: rgba(255, 255, 255, .12); }
    .mode { justify-self: end; display: flex; gap: 4px; padding: 5px; border-radius: 999px; }
    .swatch { position: relative; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .swatch::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; transition: transform .25s var(--ease); }
    .swatch-color::before { background: conic-gradient(from 200deg, #637dff, #9869eb, #ed7d83, #ff9b73, #637dff); }
    .swatch-mono::before { background: linear-gradient(135deg, #f0f1f4, #7d8089); }
    .swatch[aria-pressed="true"] { background: rgba(255, 255, 255, .14); }
    .swatch[aria-pressed="false"]::before { transform: scale(.78); opacity: .75; }

    .art-hero { position: relative; overflow: hidden; padding: clamp(148px, 19vw, 238px) 0 clamp(70px, 9vw, 126px); }
    .art-hero::after {
      content: ""; position: absolute; left: var(--gutter); right: var(--gutter); bottom: 0; height: 1px;
      background: var(--spectrum); opacity: .8;
    }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font-size: .8125rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    .art-title {
      margin: 0; font-size: clamp(4.5rem, 14vw, 12.5rem); font-weight: 270; font-stretch: 118%;
      line-height: .78; letter-spacing: -.06em;
    }
    .art-intro {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, .62fr); gap: 32px 64px;
      align-items: end; margin-top: clamp(42px, 7vw, 84px);
    }
    .art-intro p { max-width: 35ch; margin: 0; color: var(--text-2); font-size: clamp(1.15rem, 1.8vw, 1.5rem); line-height: 1.5; }
    .art-meta { justify-self: end; display: flex; gap: 28px; color: var(--text-3); font-size: .875rem; }
    .art-meta span { display: block; color: var(--text); font-size: 1.15rem; font-weight: 500; }

    .gallery-wrap { padding: clamp(70px, 8vw, 120px) 0 clamp(90px, 10vw, 150px); }
    .gallery { columns: 3; column-gap: clamp(18px, 2.4vw, 34px); }
    .art-card { break-inside: avoid; margin: 0 0 clamp(30px, 4vw, 52px); }
    .art-card.featured { column-span: all; margin-bottom: clamp(58px, 7vw, 96px); }
    .art-open {
      display: block; width: 100%; padding: 0; overflow: hidden; border: 0; border-radius: 2px;
      background: var(--panel); color: inherit; cursor: zoom-in; text-align: left;
    }
    .art-open img { width: 100%; height: auto; transition: transform .65s var(--ease), filter .35s ease; }
    .art-open:hover img { transform: scale(1.012); filter: brightness(1.04); }
    .art-open:focus-visible { border-radius: 2px; }
    .art-caption { display: flex; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 14px; }
    .art-name { margin: 0; font-size: 1rem; font-weight: 520; letter-spacing: -.01em; }
    .art-number { color: var(--text-3); font-size: .8125rem; font-variant-numeric: tabular-nums; }

    .lightbox {
      width: 100vw; max-width: none; height: 100vh; max-height: none; margin: 0; padding: 0;
      border: 0; background: rgba(0, 0, 0, .93); color: var(--text); overflow: hidden;
    }
    .lightbox::backdrop { background: rgba(0, 0, 0, .93); }
    .lightbox-inner { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 72px clamp(18px, 5vw, 72px) 82px; }
    .lightbox-image { max-width: 100%; max-height: calc(100vh - 154px); width: auto; height: auto; object-fit: contain; box-shadow: 0 30px 100px rgba(0, 0, 0, .55); }
    .lightbox-title { position: absolute; left: clamp(20px, 4vw, 56px); bottom: 28px; margin: 0; color: var(--text-2); font-size: .9375rem; }
    .lightbox-close, .lightbox-nav {
      position: absolute; z-index: 2; display: grid; place-items: center; width: 44px; height: 44px;
      padding: 0; border: 1px solid var(--line); border-radius: 50%; background: rgba(20, 20, 22, .74);
      color: var(--text); cursor: pointer; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .lightbox-close { top: 18px; right: 18px; font-size: 1.5rem; }
    .lightbox-nav { top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
    .lightbox-prev { left: 18px; }
    .lightbox-next { right: 18px; }
    .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255, 255, 255, .14); }

    .site-footer { border-top: 1px solid var(--line); }
    .footer-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 26px 0; color: var(--text-3); font-size: .875rem; }
    .footer-row p { margin: 0; }
    .footer-row a { color: var(--text-2); text-decoration: none; }
    .footer-row a:hover { color: var(--text); }

    .js .art-card { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s var(--ease); }
    .js .art-card.is-visible { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .gallery { columns: 2; }
      .art-intro { grid-template-columns: 1fr; }
      .art-meta { justify-self: start; }
    }
    @media (max-width: 640px) {
      .wordmark { display: none; }
      .site-header { grid-template-columns: 1fr auto; }
      .nav { justify-self: start; }
      .nav a { padding: 0 9px; font-size: .8125rem; }
      .art-title { font-size: clamp(4.25rem, 28vw, 7rem); }
      .art-meta { gap: 20px; }
      .gallery { columns: 1; }
      .art-card.featured { column-span: none; }
      .lightbox-inner { padding-inline: 12px; }
      .lightbox-nav { top: auto; bottom: 18px; transform: none; }
      .lightbox-prev { left: auto; right: 72px; }
      .lightbox-next { right: 18px; }
      .lightbox-title { right: 128px; bottom: 29px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .footer-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .js .art-card { opacity: 1; transform: none; transition: none; }
      .art-open img { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to artwork</a>

  <header class="site-header">
    <a class="wordmark glass" href="index.html">Brandon Stewart</a>
    <nav class="nav glass" aria-label="Main navigation">
      <a href="index.html#work">Work</a><a href="index.html#about">About</a><a href="art.html" aria-current="page">Art</a><a href="index.html#contact">Contact</a>
    </nav>
    <div class="mode glass" role="group" aria-label="Accent colors">
      <button class="swatch swatch-color" type="button" data-mode="color" aria-pressed="true" title="Color"><span class="sr-only">Color accents</span></button>
      <button class="swatch swatch-mono" type="button" data-mode="mono" aria-pressed="false" title="Monochrome"><span class="sr-only">Monochrome</span></button>
    </div>
  </header>

  <main id="main">
    <section class="art-hero" aria-labelledby="art-title">
      <div class="shell">
        <p class="eyebrow">Studio work</p>
        <h1 class="art-title" id="art-title">Art.</h1>
        <div class="art-intro">
          <p>A selection of drawings, paintings, and mixed-media work—made before and alongside the software.</p>
          <div class="art-meta" aria-label="Gallery details">
            <div><span>10</span>pieces</div>
            <div><span>Selected</span>works</div>
          </div>
        </div>
      </div>
    </section>

    <section class="gallery-wrap" aria-label="Selected artwork">
      <div class="shell gallery">
        <figure class="art-card featured">
          <button class="art-open" type="button" data-title="Ram Skull" aria-label="Open Ram Skull in full screen">
            <img src="img/art/ram-skull.webp" width="1800" height="1350" alt="Dense black ink drawing of a ram skull resting among rocks" fetchpriority="high">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Ram Skull</h2><span class="art-number">01</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Ink Study I" aria-label="Open Ink Study I in full screen">
            <img src="img/art/ink-tree-study.webp" width="1013" height="1800" alt="Monochrome ink drawing centered on a twisting tree with abstract figures" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Ink Study I</h2><span class="art-number">02</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Portrait Study" aria-label="Open Portrait Study in full screen">
            <img src="img/art/portrait-collage.webp" width="1013" height="1800" alt="Saturated abstract profile filled with layered scenes and colorful shapes" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Portrait Study</h2><span class="art-number">03</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Pointillist Study" aria-label="Open Pointillist Study in full screen">
            <img src="img/art/pointillist-study.webp" width="1397" height="1800" alt="Fine dot-and-line drawing of layered biomorphic forms" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Pointillist Study</h2><span class="art-number">04</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Ink Study II" aria-label="Open Ink Study II in full screen">
            <img src="img/art/ink-study.webp" width="1013" height="1800" alt="Vertical black ink drawing of tangled organic and mechanical forms" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Ink Study II</h2><span class="art-number">05</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Blue Waves" aria-label="Open Blue Waves in full screen">
            <img src="img/art/blue-waves.webp" width="1013" height="1800" alt="Blue and green abstract painting with layered sweeping forms" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Blue Waves</h2><span class="art-number">06</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Color Study I" aria-label="Open Color Study I in full screen">
            <img src="img/art/abstract-study.webp" width="1800" height="1013" alt="Small red, blue, and green abstract painting with eye-like forms" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Color Study I</h2><span class="art-number">07</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Aspen Trees" aria-label="Open Aspen Trees in full screen">
            <img src="img/art/aspen-trees.webp" width="1800" height="1013" alt="Loose watercolor landscape with a blue-green tree, mountains, and warm brushwork" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Aspen Trees</h2><span class="art-number">08</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Skull" aria-label="Open Skull in full screen">
            <img src="img/art/skull-study.webp" width="1800" height="1013" alt="Black and white profile of a skull and branching tree against a dark sky" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Skull</h2><span class="art-number">09</span></figcaption>
        </figure>

        <figure class="art-card">
          <button class="art-open" type="button" data-title="Color Study II" aria-label="Open Color Study II in full screen">
            <img src="img/art/color-study.webp" width="1013" height="1800" alt="Vivid geometric abstract painting in warm and cool colors" loading="lazy">
          </button>
          <figcaption class="art-caption"><h2 class="art-name">Color Study II</h2><span class="art-number">10</span></figcaption>
        </figure>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Artwork viewer">
    <div class="lightbox-inner">
      <button class="lightbox-close" type="button" aria-label="Close artwork">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous artwork">‹</button>
      <img class="lightbox-image" alt="">
      <p class="lightbox-title"></p>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="Next artwork">›</button>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="shell footer-row">
      <p>© <span id="year">2026</span> Brandon Stewart</p>
      <a href="index.html">Software portfolio</a>
    </div>
  </footer>

  <script>
    (() => {
      const root = document.documentElement;
      root.classList.add('js');

      const modeButtons = Array.from(document.querySelectorAll('[data-mode]'));
      const applyMode = (mode, save) => {
        if (mode === 'mono') root.dataset.theme = 'mono'; else delete root.dataset.theme;
        modeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
        if (save) { try { localStorage.setItem('portfolio-theme', mode); } catch (_) {} }
      };
      applyMode(root.dataset.theme === 'mono' ? 'mono' : 'color', false);
      modeButtons.forEach((button) => button.addEventListener('click', () => applyMode(button.dataset.mode, true)));

      const cards = Array.from(document.querySelectorAll('.art-card'));
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const reveal = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          });
        }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
        cards.forEach((card) => reveal.observe(card));
      } else {
        cards.forEach((card) => card.classList.add('is-visible'));
      }

      const dialog = document.querySelector('#lightbox');
      const dialogImage = dialog.querySelector('.lightbox-image');
      const dialogTitle = dialog.querySelector('.lightbox-title');
      const openers = Array.from(document.querySelectorAll('.art-open'));
      let current = 0;
      let lastOpener = null;

      const show = (index) => {
        current = (index + openers.length) % openers.length;
        const opener = openers[current];
        const image = opener.querySelector('img');
        dialogImage.src = image.currentSrc || image.src;
        dialogImage.alt = image.alt;
        dialogTitle.textContent = opener.dataset.title;
      };
      openers.forEach((opener, index) => opener.addEventListener('click', () => {
        lastOpener = opener;
        show(index);
        dialog.showModal();
        document.body.classList.add('has-dialog');
      }));
      dialog.querySelector('.lightbox-close').addEventListener('click', () => dialog.close());
      dialog.querySelector('.lightbox-prev').addEventListener('click', () => show(current - 1));
      dialog.querySelector('.lightbox-next').addEventListener('click', () => show(current + 1));
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      dialog.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') show(current - 1);
        if (event.key === 'ArrowRight') show(current + 1);
      });
      dialog.addEventListener('close', () => {
        document.body.classList.remove('has-dialog');
        dialogImage.removeAttribute('src');
        if (lastOpener) lastOpener.focus();
      });

      document.querySelector('#year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
